<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المالك - متجر الملابس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-container h2 {
            color: #2C3E50;
            margin-bottom: 30px;
        }

        .login-container input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            background-color: #2C3E50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #E74C3C;
        }

        .admin-panel {
            display: none;
            width: 100%;
            max-width: 1200px;
        }

        .admin-header {
            background-color: #2C3E50;
            color: white;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 15px;
        }

        .admin-header h1 {
            margin-bottom: 10px;
        }

        .logout-btn {
            background-color: #E74C3C;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .section {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #2C3E50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2C3E50;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .submit-btn {
            background-color: #27AE60;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #219A52;
        }

        .product-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background-color: #E74C3C;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .order-item {
            background-color: #f9f9f9;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .order-item h3 {
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .order-details {
            margin: 10px 0;
        }

        .order-details p {
            margin: 5px 0;
        }

        .total-amount {
            font-size: 1.2em;
            color: #27AE60;
            font-weight: bold;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #2C3E50;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 2em;
            color: #E74C3C;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="login-container" id="loginScreen">
        <h2>دخول المالك</h2>
        <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" onkeypress="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h1>لوحة تحكم المالك</h1>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>المنتجات</h3>
                <p id="productsCount">0</p>
            </div>
            <div class="stat-card">
                <h3>الطلبات</h3>
                <p id="ordersCount">0</p>
            </div>
            <div class="stat-card">
                <h3>إجمالي المبيعات</h3>
                <p id="totalSales">0 دج</p>
            </div>
        </div>

        <!-- إضافة منتج -->
        <div class="section">
            <h2>إضافة منتج جديد</h2>
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="newProductTitle" placeholder="مثال: قميص رجالي">
            </div>
            <div class="form-group">
                <label>الفئة:</label>
                <select id="newProductCategory">
                    <option value="men">رجال</option>
                    <option value="women">نساء</option>
                    <option value="kids">أطفال</option>
                    <option value="traditional">تقليدي</option>
                </select>
            </div>
            <div class="form-group">
                <label>السعر (دج):</label>
                <input type="number" id="newProductPrice" placeholder="مثال: 2500">
            </div>
            <div class="form-group">
                <label>السعر القديم (اختياري):</label>
                <input type="number" id="newProductOldPrice" placeholder="اتركه فارغاً إذا لا يوجد تخفيض">
            </div>
            <div class="form-group">
                <label>رابط الصورة:</label>
                <input type="text" id="newProductImage" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>المقاسات (مفصولة بفواصل):</label>
                <input type="text" id="newProductSizes" value="S, M, L, XL">
            </div>
            <div class="form-group">
                <label>الوصف:</label>
                <textarea id="newProductDescription" rows="3" placeholder="وصف المنتج..."></textarea>
            </div>
            <button class="submit-btn" onclick="addNewProduct()">إضافة المنتج</button>
        </div>

        <!-- المنتجات الحالية -->
        <div class="section">
            <h2>المنتجات الحالية</h2>
            <div id="adminProductsList"></div>
        </div>

        <!-- الطلبات -->
        <div class="section">
            <h2>طلبات المشترين</h2>
            <div id="ordersList"></div>
        </div>

        <button class="logout-btn" onclick="window.location.href='index.html'" style="width: 100%; margin-top: 20px;">
            العودة إلى المتجر
        </button>
    </div>

    <script>
        // كلمة المرور للمالك - يمكنك تغييرها
        const ADMIN_PASSWORD = "admin123"; // غيّر هذا الرقم السري!

        let products = JSON.parse(localStorage.getItem('products')) || [];
        let orders = JSON.parse(localStorage.getItem('orders')) || [];

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminData();
            } else {
                alert('كلمة المرور خاطئة!');
            }
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        function loadAdminData() {
            updateStats();
            displayAdminProducts();
            displayOrders();
        }

        function updateStats() {
            document.getElementById('productsCount').textContent = products.length;
            document.getElementById('ordersCount').textContent = orders.length;
            
            const totalSales = orders.reduce((sum, order) => sum + (order.total || 0), 0);
            document.getElementById('totalSales').textContent = totalSales + ' دج';
        }

        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
            updateStats();
        }

        function saveOrders() {
            localStorage.setItem('orders', JSON.stringify(orders));
            updateStats();
        }

        function addNewProduct() {
            const title = document.getElementById('newProductTitle').value;
            const category = document.getElementById('newProductCategory').value;
            const price = parseFloat(document.getElementById('newProductPrice').value);
            const oldPrice = document.getElementById('newProductOldPrice').value ? parseFloat(document.getElementById('newProductOldPrice').value) : null;
            const image = document.getElementById('newProductImage').value || 'https://via.placeholder.com/400x500?text=New+Product';
            const sizes = document.getElementById('newProductSizes').value.split(',').map(s => s.trim());
            const description = document.getElementById('newProductDescription').value;
            
            if (!title || !price) {
                alert('الرجاء إدخال اسم المنتج والسعر');
                return;
            }
            
            const categoryNames = {
                'men': 'رجال',
                'women': 'نساء',
                'kids': 'أطفال',
                'traditional': 'تقليدي'
            };
            
            const newProduct = {
                id: Date.now(),
                title: title,
                category: category,
                categoryName: categoryNames[category],
                price: price,
                oldPrice: oldPrice,
                image: image,
                sizes: sizes,
                description: description || 'منتج جديد'
            };
            
            products.push(newProduct);
            saveProducts();
            
            document.getElementById('newProductTitle').value = '';
            document.getElementById('newProductPrice').value = '';
            document.getElementById('newProductOldPrice').value = '';
            document.getElementById('newProductImage').value = '';
            document.getElementById('newProductDescription').value = '';
            document.getElementById('newProductSizes').value = 'S, M, L, XL';
            
            alert('تمت إضافة المنتج بنجاح!');
            displayAdminProducts();
        }

        function displayAdminProducts() {
            const list = document.getElementById('adminProductsList');
            list.innerHTML = '';
            
            if (products.length === 0) {
                list.innerHTML = '<p>لا توجد منتجات</p>';
                return;
            }
            
            products.forEach(product => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <div>
                        <strong>${product.title}</strong>
                        <br>
                        <small>${product.categoryName} - ${product.price} دج</small>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${product.id})">حذف</button>
                `;
                list.appendChild(item);
            });
        }

        function deleteProduct(productId) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products = products.filter(p => p.id !== productId);
                saveProducts();
                displayAdminProducts();
            }
        }

        function displayOrders() {
            const list = document.getElementById('ordersList');
            list.innerHTML = '';
            
            if (orders.length === 0) {
                list.innerHTML = '<p style="text-align: center;">لا توجد طلبات بعد</p>';
                return;
            }
            
            orders.forEach((order, index) => {
                const orderDiv = document.createElement('div');
                orderDiv.className = 'order-item';
                
                const paymentMethodText = {
                    'cod': 'الدفع عند الاستلام',
                    'baridimob': 'بريدي موب',
                    'ccp': 'حوالة بريدية CCP'
                };
                
                orderDiv.innerHTML = `
                    <h3>طلب رقم ${index + 1}</h3>
                    <p><small>التاريخ: ${order.date || 'غير محدد'}</small></p>
                    <hr style="margin: 10px 0;">
                    <div class="order-details">
                        <p><strong>الاسم:</strong> ${order.customer.name}</p>
                        <p><strong>الهاتف:</strong> <a href="tel:${order.customer.phone}">${order.customer.phone}</a></p>
                        <p><strong>الولاية:</strong> ${order.customer.wilaya}</p>
                        <p><strong>البلدية:</strong> ${order.customer.commune}</p>
                        <p><strong>العنوان:</strong> ${order.customer.address}</p>
                        <p><strong>طريقة الدفع:</strong> ${paymentMethodText[order.paymentMethod] || order.paymentMethod}</p>
                    </div>
                    <hr style="margin: 10px 0;">
                    <h4>المنتجات المطلوبة:</h4>
                    ${order.items.map(item => `
                        <p>- ${item.title} (${item.selectedSize}) = ${item.price} دج</p>
                    `).join('')}
                    <p class="total-amount" style="margin-top: 10px;">
                        المجموع: ${order.total} دج
                    </p>
                    <button class="delete-btn" onclick="deleteOrder(${index})" style="margin-top: 10px;">
                        حذف الطلب
                    </button>
                `;
                list.appendChild(orderDiv);
            });
        }

        function deleteOrder(index) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                orders.splice(index, 1);
                saveOrders();
                displayOrders();
            }
        }
    </script>
</body>
</html>
